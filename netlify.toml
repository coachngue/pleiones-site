# netlify.toml

[build]
  command = "npm run build"         # commande pour construire ton site
  publish = ".next"                 # dossier de build pour Netlify
  environment = { 
    NODE_VERSION = "20.9.0"         # version Node recommandée pour Next.js 16+
  }

# Utilisation du plugin officiel Netlify pour Next.js
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirections éventuelles (facultatif)
[[redirects]]
  from = "/_not-trouvé"
  to = "/"
  status = 302
  force = true
